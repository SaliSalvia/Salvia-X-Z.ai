name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build SaliX-Z APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: ver
        run: |
          set -e
          APP_VER=$(sed -n 's/^app\.versionName=//p' gradle.properties | head -n1)
          [ -z "$APP_VER" ] && APP_VER="3.0.0"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$APP_VER"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK
        id: build
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p dist
          if [ -n "$KS_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "Signing secrets detected — building signed release APK"
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -PversionCode=${{ steps.ver.outputs.code }} \
              -PversionName=${{ steps.ver.outputs.ver }}
            APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "raw_apk=$APK" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets configured — building installable debug APK"
            ./gradlew assembleDebug --no-daemon --stacktrace \
              -PversionCode=${{ steps.ver.outputs.code }} \
              -PversionName=${{ steps.ver.outputs.ver }}
            APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
            cp "$APK" "dist/SaliX-Z-${{ steps.ver.outputs.ver }}.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign release APK (when secrets provided)
        if: steps.build.outputs.signed == 'true'
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          printf '%s' "$KS_B64" | base64 -d > release.keystore
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq apksigner >/dev/null 2>&1
            APKSIGNER=apksigner
          fi
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "dist/SaliX-Z-${{ steps.ver.outputs.ver }}.apk" "${{ steps.build.outputs.raw_apk }}"
          "$APKSIGNER" verify --print-certs "dist/SaliX-Z-${{ steps.ver.outputs.ver }}.apk"
          rm -f release.keystore

      - name: Generate checksums
        run: |
          set -e
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaliX-Z-${{ steps.ver.outputs.ver }}-APK
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release (on tag or signed release)
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG_NAME="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" dist/* \
              --target "$GITHUB_SHA" \
              --title "SaliX-Z ${{ steps.ver.outputs.ver }}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
